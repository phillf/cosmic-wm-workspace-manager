name: sysadmin-live-native-reroute
description: >
  Live reroute for managed native applications only. Browser windows are
  intentionally excluded so an unmatched title cannot create a generic window.
monitors: []
apps:
  - command: spotify
    workspace: 1
    match:
      class: Spotify

  - command: /usr/bin/wezterm-gui start --always-new-process --class me.creativetech.terminal.workspace2 -- bash -lc 'exec "$SHELL"'
    workspace: 2
    match:
      class: me.creativetech.terminal.workspace2

  - command: /usr/bin/wezterm-gui start --always-new-process --class me.creativetech.terminal.workspace3 -- bash -lc 'exec "$SHELL"'
    workspace: 3
    match:
      class: me.creativetech.terminal.workspace3

  - command: /usr/bin/wezterm-gui start --always-new-process --class me.creativetech.terminal.workspace4 -- bash -lc 'exec "$SHELL"'
    workspace: 4
    match:
      class: me.creativetech.terminal.workspace4

  - command: code
    workspace: 5
    match:
      class: code

  - command: /usr/bin/discord
    workspace: 6
    match:
      class: discord

  - command: /usr/bin/slack
    workspace: 6
    match:
      class: slack

  - command: /usr/bin/mattermost-desktop
    workspace: 6
    match:
      class: Mattermost.Desktop

  - command: /opt/Signal/signal-desktop
    workspace: 6
    match:
      class: signal

  - command: /usr/share/gitkraken/gitkraken
    workspace: 6
    match:
      class: gitkraken
      title: GitKraken Desktop
